<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- 첫 화면이 그려지기 전 흰 화면이 번쩍이지 않도록 배경색만 먼저 -->
    <style>
      html { background: #f6f1e9; }
      @media (prefers-color-scheme: dark) { html { background: #1e1d22; } }
    </style>
    <title>OFFROU | 같은 하루에, 다른 시간을</title>
    <meta
      name="description"
      content="반복되는 일상에서 잠시 벗어나 평소와 다른 시간을 만나보세요. OFFROU는 휴식, 놀이, 취미, 경험과 작은 외출을 제안합니다."
    />
    <meta name="application-name" content="OFFROU" />

    <!-- 공유 미리보기 (Open Graph). og:url · og:image · canonical은 배포 주소/이미지가 정해지면
         VITE_SITE_URL · VITE_OG_IMAGE 환경변수로 빌드 시 추가된다 (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OFFROU" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="OFFROU | 같은 하루에, 다른 시간을" />
    <meta
      property="og:description"
      content="반복되는 일상에서 잠시 벗어나 평소와 다른 시간을 만나보세요. OFFROU는 휴식, 놀이, 취미, 경험과 작은 외출을 제안합니다."
    />
    <meta name="twitter:card" content="summary" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F6F1E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1E1D22" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OFFROU" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Font: Pretendard (없으면 시스템 폰트로 대체) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 첫 화면을 막지 않도록 글꼴 CSS는 비동기로 (그동안은 시스템 글꼴) -->
    <link
      rel="preload"
      as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
